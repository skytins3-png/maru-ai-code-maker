<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b25"><meta name="description" content="강호풍운록 · 중국어만으로 읽는 장편 정통 무협과 예습·문장·단어·방언·복습"><title>강호풍운록 | 江湖风云录</title>
<style>
:root{--bg:#171b25;--panel:#242b36;--ink:#f6f0e5;--muted:#bdc5c9;--gold:#e6c785;--line:#4b5360}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Noto Sans SC",sans-serif;background:linear-gradient(170deg,#151923,#242832 65%,#171b25);min-height:100vh}.wrap{max-width:850px;margin:auto;padding:0 14px 96px}header{position:sticky;top:0;z-index:8;background:#151923f2;border-bottom:1px solid #56576a;padding:14px 0 12px;backdrop-filter:blur(10px)}header .row{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{margin:0;color:var(--gold);font-family:serif;font-size:clamp(27px,6vw,38px);letter-spacing:.04em}.subtitle{font-size:12px;color:var(--muted)}button,select{font:inherit}button{border:1px solid #8a7853;background:#242a35;color:var(--ink);border-radius:12px;min-height:44px;padding:9px 14px;cursor:pointer}button:focus-visible{outline:3px solid #ebca6e}button.active,.primary{background:var(--gold);color:#191922;font-weight:800}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.tabs button{min-width:0;padding:8px 3px;font-size:15px}.meta{font-size:13px;color:#f0daa9}.card{background:#232a35;border:1px solid #545761;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 20px #0002}.card h2,.card h3{margin:0 0 12px}.compact{font-size:14px;color:var(--muted);line-height:1.6}.chapter-title{font-size:23px;color:var(--gold);font-weight:800}.comic{display:flex;flex-direction:column;gap:14px}.panel{background:#f2efe8;color:#101015;border:4px solid #070707;border-radius:4px;overflow:hidden}.panel img{width:100%;display:block;max-height:680px;object-fit:contain;background:#101015}.speech{padding:16px 15px 18px;background:#f8f5ef;line-height:1.5;font-size:clamp(25px,5.3vw,36px);font-family:"Noto Serif SC",serif;font-weight:700;text-align:center;word-break:keep-all}.panel-index{color:#e1bc75;font-size:13px;margin-bottom:8px}.focus{font-size:clamp(27px,5vw,36px);line-height:1.55;font-weight:800;color:#fff}.pinyin{font-size:20px;color:#eaca8a;line-height:1.6}.mean{font-size:19px;line-height:1.65}.mini{font-size:14px;color:#aebdc5}.study-item{border-bottom:1px solid #515966;padding:15px 0}.study-item:last-child{border:0}.study-item strong{font-size:25px}.study-item p{margin:5px 0 9px;line-height:1.6}.chip{background:#384354;border-radius:99px;padding:4px 10px;color:#f2d896;font-size:12px}.speaker{border:0;background:#445161;padding:4px 11px;min-height:36px}.progress{background:#3a4250;border-radius:9px;height:12px;overflow:hidden}.progress i{display:block;height:100%;background:#e7c17b;width:0}.hidden{display:none!important}.message{background:#172c2d;color:#b6eece;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.55}.answer{display:none;background:#223d3a;padding:12px;border-radius:10px;margin:9px 0}.answer.show{display:block}select{width:100%;padding:12px;border-radius:12px;background:#202733;border:1px solid #85806b;color:#fff}#list{max-height:240px;overflow:auto;display:flex;gap:6px;flex-wrap:wrap}#list button{padding:7px 12px;min-height:36px}footer{color:#aeb6c3;padding:14px 0 28px;font-size:12px;line-height:1.8}.big .speech{font-size:clamp(33px,6.8vw,43px)}.status{color:#e6c785;font-size:13px;line-height:1.5}.date{font-size:13px;color:#b9c4ca}.note{background:#3b3122;border-left:3px solid var(--gold);padding:12px;line-height:1.6}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px}.toolbar>*{flex:1}body{touch-action:pan-y}@media(min-width:700px){.tabs{grid-template-columns:repeat(6,1fr)}.wrap{padding:0 24px 95px}.comic{max-width:740px;margin:auto}.panel img{max-height:500px;object-fit:cover}}
</style></head><body><header><div class="wrap"><div class="row"><div><h1>江湖风云录</h1><div class="subtitle">강호풍운록 · 매일 한 페이지 · 만화에는 중국어만</div></div><button id="size">글자 크게</button></div></div></header><main class="wrap"><div class="card"><div class="meta" id="pubdate">회차를 불러오는 중…</div><div class="chapter-title" id="chapter"></div><div class="compact" id="hook"></div><div class="row" style="margin-top:10px"><button class="primary" id="refresh">새 회차 확인</button><button id="playCurrent">중국어 한 번 듣기</button><button id="stop">■ 정지</button></div></div><nav class="tabs" id="tabs"><button data-tab="prep">예습</button><button data-tab="comic" class="active">만화</button><button data-tab="sentences">문장</button><button data-tab="words">단어</button><button data-tab="dialects">사투리</button><button data-tab="review">복습</button></nav><div id="content"></div><div class="card"><div class="toolbar"><button id="prev">◀ 이전 회차</button><div id="epnum" style="text-align:center"></div><button id="next">다음 회차 ▶</button></div><div id="list" style="margin-top:12px"></div><p class="compact">하루 한 페이지씩 올라오는 정통 무협 연재. 아직 공개되지 않은 회차는 목록에 표시하지 않습니다.</p></div><footer>중국어 만화는 중국어만 표시합니다. 뜻·병음·성조는 학습 탭에서 따로 공부하세요.<p>학습 진도는 현재 브라우저에 저장됩니다. 다른 기기와 자동 동기화는 아직 지원하지 않습니다. 매일 새 회차 반영에는 온라인 게시 작업이 필요합니다.</p></footer></main>
<script>
"use strict";
let ALL=[],ep=0,tab="comic",pos=0,repeatToken=0,selected=null;
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(Date.now()-5*60*60*1000));
const key=(part)=>"maru-wuxia-"+(ALL[ep]?.id??"001")+"-"+part;
const store=(k,v)=>localStorage.setItem(key(k),JSON.stringify(v));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(key(k)))??d}catch{return d}};
function lesson(){return ALL[ep]??ALL[0]}
function setTab(t){tab=t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x.dataset.tab===t));render()}
function lineText(x){return esc(x.zh)}
function speak(txt,rate=.72,lang="zh-CN"){if(!("speechSynthesis" in window))return Promise.resolve();return new Promise(resolve=>{let u=new SpeechSynthesisUtterance(txt);u.lang=lang;u.rate=rate;let done=false;u.onend=u.onerror=()=>{if(!done){done=true;resolve()}};speechSynthesis.speak(u);setTimeout(()=>{if(!done){done=true;resolve()}},Math.max(3500,txt.length*700+1500))})}
function stop(){repeatToken++;if("speechSynthesis" in window)speechSynthesis.cancel();$("#stop").textContent="■ 정지"}
async function five(lines){stop();let id=repeatToken;$("#stop").textContent="■ 재생 중단";for(let round=1;round<=5;round++){for(let l of lines){if(id!==repeatToken)return;$("#pubdate").textContent="학습 듣기 "+round+"/5 · "+l.zh;await speak(l.zh,.57);if(id!==repeatToken)return;await speak(l.zh,.8)} }if(id===repeatToken){$("#pubdate").textContent="5회 반복 완료";$("#stop").textContent="■ 정지"}}
function choose(n){if(n<0||n>=ALL.length)return;stop();ep=n;pos=0;history.replaceState(null,"","#"+ALL[ep].id);render()}
function renderNav(){let e=lesson();$("#chapter").textContent="제"+e.id+"화 · "+e.title;$("#hook").textContent=e.teaser??"";$("#epnum").textContent=(ep+1)+" / "+ALL.length;$("#list").innerHTML=ALL.map((x,i)=>'<button class="'+(i===ep?'active':'')+'" data-go="'+i+'">'+esc(x.id)+'화</button>').join("");$("#prev").disabled=ep===0;$("#next").disabled=ep===ALL.length-1;$("#pubdate").textContent="공개 "+(e.published??e.release_at)+" · "+day()+" 기준"}
function art(e,i){const n=Number(e.id)||0,seed=n*13+i*7,night=n%3===0;const rain=Array.from({length:45},(_,j)=>{const x=(j*47+seed*11)%900,y=(j*79+seed*17)%420;return '<path d="M'+x+' '+y+' l-23 47" stroke="'+(night?'#9babb9':'#57606a')+'" stroke-width="1" opacity=".48"/>'}).join('');const trees=Array.from({length:9},(_,j)=>{const x=j*122-15;return '<path d="M'+x+' 370v-120m0 40-28-21m28-29 26-27" fill="none" stroke="#20252b" stroke-width="5"/>'}).join('');const face=(x,y,rev)=>'<g transform="translate('+x+' '+y+') scale('+(rev?-1:1)+' 1)"><path d="M-55 140Q-75 72-55 33L-46-2Q-2-42 40-10Q62 31 52 68L60 145Z" fill="#1d2329" stroke="#111" stroke-width="5"/><path d="M-37 19Q-37-32 0-32Q39-24 34 26L20 58L-4 73L-28 53Z" fill="#d7d8d6" stroke="#0f141b" stroke-width="5"/><path d="M-27 11L1 6M6 8L30 9M-20 19h15M11 18h13" stroke="#15191b" stroke-width="4"/><path d="M-43-3Q-8-65 28-26L43-2L-44-6" fill="#0f171b"/><path d="M-54 142L-24 66L32 68L77 142Z" fill="#2b3138" stroke="#111" stroke-width="5"/></g>';const sword=i%2===0?'<path d="M530 272L850 113L862 98L540 253Z" fill="#f5f5f4" stroke="#131b1e" stroke-width="4"/>':'';return '<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="무협 장면 흑백 삽화" style="display:block;width:100%;background:#b2b6b6"><defs><pattern id="hatch'+seed+'" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0" stroke="#6f7677" stroke-width="1"/></pattern></defs><path d="M0 0H900V420H0Z" fill="'+(night?'#848a8d':'#d2d3cd')+'"/><circle cx="'+(690-seed%200)+'" cy="92" r="50" fill="#eef0e9" opacity=".8"/><path d="M0 237L160 80L300 236L431 116L568 229L732 87L900 238V420H0" fill="#a5aaab" stroke="#353c43" stroke-width="5"/><path d="M0 295L245 184L382 301L615 164L900 286V420H0" fill="url(#hatch'+seed+')" stroke="#52585b" stroke-width="5"/><path d="M0 335H900V420H0" fill="#63686d"/>'+trees+rain+'<path d="M210 301L340 236L450 270V367H203Z" fill="#202429" stroke="#151515" stroke-width="4"/><path d="M196 272L330 193L470 272" fill="none" stroke="#11181c" stroke-width="17"/>'+face(310,202,false)+face(700,204,true)+sword+'</svg>'}
function viewComic(e){let arr=e.panels??[];return '<div class="card"><div class="meta">만화 속 대사는 중국어만 · 장면 '+(pos+1)+' / '+arr.length+'</div><div class="comic">'+arr.map((p,i)=>'<article class="panel '+(i!==pos?'hidden':'')+'"><div class="panel-index" style="display:none">'+(i+1)+'</div>'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="강호풍운록 만화 장면 '+(i+1)+'">':art(e,i))+'<div class="speech" lang="zh-CN">'+esc(p.zh)+'</div></article>').join("")+'</div><div class="toolbar" style="margin-top:12px"><button data-frame="-1">◀ 이전 장면</button><button data-frame="1">다음 장면 ▶</button></div><p class="compact">※ 만화 속 대사만 중국어로 표시합니다. 문장과 단어를 따로 배우려면 학습 탭을 누르세요.</p></div>'}
function viewPrep(e){let lines=e.panels??[];return '<section class="card"><h2>예습 · 오늘의 사건</h2><p class="mean">'+esc(e.prep??"")+'</p><p class="note">오늘 만화에 등장하는 중국어 대사 '+lines.length+'개를 먼저 소리로 익히세요. 스토리의 정답은 만화에서 확인하세요.</p><button class="primary" data-five="pre">오늘 대사 × 5회 느리게</button><div class="study-item"><h3>오늘의 문법 열쇠</h3><p>'+esc(e.grammar??"")+'</p></div></section>'}
function viewSentences(e){return '<section class="card"><h2>문장 학습 · 빠짐없이</h2><p class="compact">만화 속 등장 순서 그대로, 반복된 문장도 다시 공부합니다.</p><button class="primary" data-five="sentences">문장 전부 × 5회</button>'+e.panels.map((p,i)=>'<div class="study-item"><span class="chip">대사 '+(i+1)+'</span><p class="focus">'+esc(p.zh)+'</p><p class="pinyin">'+esc(p.py??"")+'</p><p class="mean">'+esc(p.ko??"")+'</p><p class="compact">문법·사용법: '+esc(p.note??"")+'</p><div class="row"><button class="speaker" data-speak="'+i+'">▶ 발음</button><button class="speaker" data-linefive="'+i+'">×5 반복</button></div></div>').join("")+'</section>'}
function viewWords(e){return '<section class="card"><h2>단어 학습 · 등장 순서</h2><p class="compact">중복 단어도 생략하지 않고 다시 익힙니다. 총 '+(e.words??[]).length+'자리</p><button class="primary" data-wordfive="1">단어 전부 × 5회</button>'+(e.words??[]).map((w,i)=>'<div class="study-item"><span class="chip">'+(i+1)+'번</span> <strong>'+esc(w.zh)+'</strong> <span class="pinyin">'+esc(w.py)+'</span><p class="mean">'+esc(w.ko)+'</p><p class="compact">'+esc(w.usage??"")+'</p><button class="speaker" data-word="'+i+'">▶ 한 단어 듣기</button></div>').join("")+'</section>'}
function viewDialects(e){return '<section class="card"><h2>강호 여행 · 지역별 말투</h2><p class="compact">보통화와 지역 구어·방언을 비교합니다. 방언의 실제 음성 체계는 지역마다 다르므로 중국어 음성이 제공되지 않는 항목은 텍스트로 비교합니다.</p>'+(e.dialects??[]).map((d,i)=>'<div class="study-item"><span class="chip">'+esc(d.region)+'</span><p class="focus">'+esc(d.zh)+'</p><p class="pinyin">'+esc(d.py??"")+'</p><p class="mean">'+esc(d.ko??"")+'</p><p class="compact">'+esc(d.note??"")+'</p></div>').join("")+'</section>'}
function viewReview(e){let items=e.panels??[];let done=load("review",{});let completed=Object.keys(done).filter(x=>done[x]).length;return '<section class="card"><h2>예습 → 본학습 → 복습</h2><div class="progress"><i style="width:'+(100*completed/Math.max(1,items.length))+'%"></i></div><p class="compact">'+completed+' / '+items.length+'문장 복습 완료 · 1·3·7일 후 다시 복습하세요</p><button class="primary" data-five="review">오늘 전체 문장 × 5회</button>'+items.map((p,i)=>'<div class="study-item"><span class="chip">복습 '+(i+1)+'</span><p class="mean">'+esc(p.ko)+'</p><button data-reveal="'+i+'">정답 보기</button><button data-done="'+i+'">'+(done[i]?'✓ 복습 완료':'복습 완료 표시')+'</button><div class="answer" id="ans'+i+'"><p class="focus">'+esc(p.zh)+'</p><p class="pinyin">'+esc(p.py??"")+'</p></div></div>').join("")+'</section>'}
function render(){if(!ALL.length)return;let e=lesson();renderNav();$("#content").innerHTML=({prep:viewPrep,comic:viewComic,sentences:viewSentences,words:viewWords,dialects:viewDialects,review:viewReview}[tab])(e)}
async function update(){try{let r=await fetch("episodes.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);let d=await r.json();let available=(Array.isArray(d)?d:(d.episodes??[])).filter(e=>e.release_at<=day()).sort((a,b)=>a.id.localeCompare(b.id));if(!available.length)throw Error("공개된 회차 없음");let old=ALL[ep]?.id;ALL=available;let hash=decodeURIComponent(location.hash.slice(1));let target=ALL.findIndex(e=>e.id===(old||hash));ep=target>=0?target:ALL.length-1;render()}catch(err){$("#content").innerHTML='<div class="card"><h2>새 회차를 불러오지 못했어요</h2><p class="compact">인터넷 연결 또는 사이트 게시 상태를 확인하세요. 오류: '+esc(err.message)+'</p></div>'}}
document.addEventListener("click",e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.tab)return setTab(b.dataset.tab);if(b.dataset.go)return choose(+b.dataset.go);if(b.dataset.frame){pos=Math.max(0,Math.min(lesson().panels.length-1,pos+(+b.dataset.frame)));return render()}if(b.dataset.speak)return speak(lesson().panels[+b.dataset.speak].zh);if(b.dataset.word)return speak(lesson().words[+b.dataset.word].zh,.6);if(b.dataset.wordfive)return five(lesson().words.map(w=>({zh:w.zh})));if(b.dataset.linefive)return five([lesson().panels[+b.dataset.linefive]]);if(b.dataset.five)return five(lesson().panels);if(b.dataset.reveal){let a=$("#ans"+b.dataset.reveal);a.classList.toggle("show");return}if(b.dataset.done){let d=load("review",{});d[b.dataset.done]=!d[b.dataset.done];store("review",d);return render()}});
$("#prev").onclick=()=>choose(ep-1);$("#next").onclick=()=>choose(ep+1);$("#refresh").onclick=update;$("#size").onclick=()=>document.body.classList.toggle("big");$("#stop").onclick=stop;$("#playCurrent").onclick=()=>speak((lesson().panels[pos]??{}).zh||"");document.addEventListener("visibilitychange",()=>{if(!document.hidden)update()});update();
</script></body></html>
