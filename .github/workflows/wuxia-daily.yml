name: MARU Daily Wuxia Chinese Comic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wuxia-daily.yml']
  schedule:
    - cron: '0 20 * * *'  # 05:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: maru-wuxia-daily
  cancel-in-progress: false
jobs:
  new-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout separate wuxia serial branch
        uses: actions/checkout@v4
        with:
          ref: maru-wuxia-serial
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install comics illustration library
        run: pip install Pillow==11.3.0 pypinyin jieba
      - name: Check the next scheduled issue in an isolated test folder
        if: github.event_name == 'push'
        env:
          WUXIA_PREVIEW_DATE: '2026-11-18'
        run: |
          mkdir -p /tmp/maru-wuxia-verify
          cp episodes.json /tmp/maru-wuxia-verify/
          cp -a assets wuxia_auto /tmp/maru-wuxia-verify/
          python /tmp/maru-wuxia-verify/wuxia_auto/generate_episode.py
          python - <<'PY'
          import json
          data=json.load(open('/tmp/maru-wuxia-verify/episodes.json'))
          ch=data['episodes'][-1]
          assert ch['id']=='002' and ch['release_at']=='2026-11-18'
          assert len(ch['panels'])>=5 and len(ch['words'])>=8
          print('Next chapter test succeeded:',ch['id'],len(ch['panels']),'illustrated scenes and',len(ch['words']),'word occurrences')
          PY
      - name: Author the next original chapter and study material
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wuxia_auto/generate_episode.py
      - name: Commit episodes and illustrated panels
        run: |
          git config user.name "MARU Wuxia Daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json assets/
          if ! git diff --cached --quiet; then
            git commit -m "Daily wuxia chapter $(date -u +%F)"
            git push origin HEAD:maru-wuxia-serial
          else
            echo "No new episode to commit."
          fi
      - name: Publish publicly readable online episode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wuxia_auto/publish_issue.py
