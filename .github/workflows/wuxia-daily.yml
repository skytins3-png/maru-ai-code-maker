name: MARU Daily Wuxia Chinese Comic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wuxia-daily.yml']
  schedule:
    - cron: '0 20 * * *'  # 05:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: maru-wuxia-daily
  cancel-in-progress: false
jobs:
  new-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout separate wuxia serial branch
        uses: actions/checkout@v4
        with:
          ref: maru-wuxia-serial
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install comics illustration library
        run: pip install Pillow==11.3.0
      - name: Check AI model access on first install
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          obj = {"model":"openai/gpt-4.1-mini",
                 "messages":[{"role":"user","content":"Return only {\"ok\": true}"}],
                 "max_tokens":40,"response_format":{"type":"json_object"}}
          req = urllib.request.Request("https://models.github.ai/inference/chat/completions",
                data=json.dumps(obj).encode(),method="POST",
                headers={"Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
                  "Content-Type":"application/json","Accept":"application/vnd.github+json"})
          try:
              with urllib.request.urlopen(req,timeout=40) as f:
                  body=json.load(f)
              print("GitHub Models response:",body["choices"][0]["message"]["content"][:100])
          except urllib.error.HTTPError as e:
              print("GitHub Models unavailable; fallback episode may be used. HTTP",e.code)
              raise
          PY
      - name: Author the next original chapter and study material
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wuxia_auto/generate_episode.py
      - name: Commit episodes and illustrated panels
        run: |
          git config user.name "MARU Wuxia Daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json assets/
          if ! git diff --cached --quiet; then
            git commit -m "Daily wuxia chapter $(date -u +%F)"
            git push origin HEAD:maru-wuxia-serial
          else
            echo "No new episode to commit."
          fi
      - name: Publish publicly readable online episode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wuxia_auto/publish_issue.py
