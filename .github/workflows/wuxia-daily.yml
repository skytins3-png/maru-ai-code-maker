name: MARU Daily Wuxia Chinese Comic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wuxia-daily.yml']
  schedule:
    - cron: '0 20 * * *'  # 05:00 Asia/Seoul (UTC+9)
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: maru-wuxia-daily
  cancel-in-progress: false
jobs:
  new-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout separate wuxia serial branch
        uses: actions/checkout@v4
        with:
          ref: maru-wuxia-serial
          persist-credentials: true
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install comics illustration library
        run: pip install Pillow==11.3.0 pypinyin jieba
      - name: Test pre-scheduled art and later story generation in isolation
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/maru-wuxia-early /tmp/maru-wuxia-later
          cp episodes.json /tmp/maru-wuxia-early/
          cp -a assets wuxia_auto /tmp/maru-wuxia-early/
          cp episodes.json /tmp/maru-wuxia-later/
          cp -a assets wuxia_auto /tmp/maru-wuxia-later/
          WUXIA_PREVIEW_DATE=2026-11-18 python /tmp/maru-wuxia-early/wuxia_auto/generate_episode.py
          WUXIA_PREVIEW_DATE=2026-11-25 python /tmp/maru-wuxia-later/wuxia_auto/generate_episode.py
          python - <<'PY'
          import json, pathlib
          early=pathlib.Path('/tmp/maru-wuxia-early')
          later=pathlib.Path('/tmp/maru-wuxia-later')
          ed=json.loads((early/'episodes.json').read_text())['episodes']
          ch=next(e for e in ed if e['release_at']=='2026-11-18')
          assert len(ch['panels'])>=5 and all((early/p['image']).exists() for p in ch['panels'])
          ld=json.loads((later/'episodes.json').read_text())['episodes']
          next_ch=next(e for e in ld if e['release_at']=='2026-11-25')
          assert next_ch['id']=='009' and len(next_ch['words'])>=8
          assert all((later/p['image']).exists() for p in next_ch['panels'])
          print('Verified future daily release: artwork on 11/18 and fully studied chapter 009 on 11/25')
          PY
      - name: Author the next original chapter and study material
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wuxia_auto/generate_episode.py
      - name: Commit episodes and illustrated panels
        run: |
          git config user.name "MARU Wuxia Daily"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.json assets/
          if ! git diff --cached --quiet; then
            git commit -m "Daily wuxia chapter $(date -u +%F)"
            git push origin HEAD:maru-wuxia-serial
          else
            echo "No new episode to commit."
          fi
      - name: Publish publicly readable online episode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python wuxia_auto/publish_issue.py
